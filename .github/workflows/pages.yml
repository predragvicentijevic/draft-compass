name: Refresh research and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Refresh manual research
        if: github.event_name != 'push'
        run: npm run update:data
      - name: Verify rankings and data handling
        run: npm test
      - name: Save source freshness and valid research
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data.json public/dotafuel.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh manual counter research snapshots'
            git push
          fi
      - name: Build static website
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
